<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
    
    <header class="title">
        <h1>
            Blackjack
        </h1>
    </header>

    <div class="container">
        <div class="row mt-2">
            <div class="col text-center">
                <button class="btn btn-primary" id="nuevoJuego">Nuevo Juego</button>
                <button disabled class="btn btn-success" id="pedirCarta">Pedir Carta</button>
                <button disabled class="btn btn-danger" id="plantarse">Plantarse</button>
            </div>
        </div>
    
        <div class="row container">
            <div class="col">
                <h2>Jugador - <small>0</small></h2>
                
                <div id="jugador-cartas" class="divCartas">
                </div>
            </div>
        </div>
    
        <div class="row container mt-2">
            <div class="col">
                <h2>Computadora - <small>0</small></h2>
                
                <div id="computadora-cartas" class="divCartas">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
    <script src="assets/js/underscore-min.js"></script>
    <script src="assets/js/juego.js"></script>

    <script>
        juego.inicializarJuego();
    </script>
</body>
</html>
